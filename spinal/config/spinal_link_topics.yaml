version: 1

# This file is the single source of truth for the DDS entities created on the
# STM32 and Linux sides of Spinal Link. Run scripts/generate_spinal_link_topics.py
# after changing it. Set enabled to false to remove a topic from both endpoints.
topics:
  - message: HEARTBEAT
    id: 1
    topic: aerial/spinal_link/heartbeat
    direction: spinal_to_host
    enabled: true
    reliability: best_effort
    durability: volatile
    history_depth: 1
    application_ack: false
    deduplicate: false

  - message: IMU
    id: 2
    topic: aerial/spinal_link/imu
    direction: spinal_to_host
    enabled: true
    reliability: best_effort
    durability: volatile
    history_depth: 1
    application_ack: false
    deduplicate: false

